services:
  postgres:
    image: postgres:15
    container_name: isc_postgres
    networks:
      - c2-shared-net
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-isc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-isc_pass}
      - POSTGRES_DB=${POSTGRES_DB:-isc_db}
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: isc_temporal
    networks:
      - c2-shared-net
    ports:
      - "7233:7233"
      - "8233:8233"
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-isc_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-isc_pass}
      - POSTGRES_SEEDS=postgres
      - ISC_TASK_QUEUE=${ISC_TASK_QUEUE:-isc-smeac-queue}
      - PMDL_TASK_QUEUE=${PMDL_TASK_QUEUE:-pmdl-ingestion-queue}
    depends_on:
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pmdl_mosquitto
    networks:
      - c2-shared-net
    ports:
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  minio:
    image: minio/minio:latest
    container_name: pmdl_minio
    networks:
      - c2-shared-net
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: pmdl_memgraph
    networks:
      - c2-shared-net
    ports:
      - "7687:7687"
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - memgraph_data:/var/lib/memgraph

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: isc_backend
    networks:
      - c2-shared-net
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://isc_user:isc_pass@postgres:5432/isc_db}
      - TEMPORAL_URL=${TEMPORAL_URL:-temporal:7233}
      - ISC_TASK_QUEUE=${ISC_TASK_QUEUE:-isc-smeac-queue}
      - PMDL_TASK_QUEUE=${PMDL_TASK_QUEUE:-pmdl-ingestion-queue}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MEMGRAPH_BOLT_URI=${MEMGRAPH_BOLT_URI:-bolt://memgraph:7687}
      - DEFAULT_PROJECT_ID=${DEFAULT_PROJECT_ID:-default-theater}
      - PARQUET_FLUSH_INTERVAL_S=${PARQUET_FLUSH_INTERVAL_S:-10}
      - CORRELATION_RADIUS_M=${CORRELATION_RADIUS_M:-150.0}
      - CORRELATION_WINDOW_S=${CORRELATION_WINDOW_S:-60.0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_COPILOT_MODEL=${GEMINI_COPILOT_MODEL:-gemini-2.5-flash-lite}
      - COMMANDER_PASSPHRASE=${COMMANDER_PASSPHRASE:-}
      - SWARM_DEFAULT_ENDPOINT=${SWARM_DEFAULT_ENDPOINT:-http://edge_drone:8090}
    command: uvicorn src.uservice.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - temporal
      - mosquitto
      - minio
      - memgraph

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: isc_dashboard
    networks:
      - c2-shared-net
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: python3 -m http.server 8080 -d src/dashboard
    depends_on:
      - backend

  virtual_cam:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: isc_virtual_cam
    networks:
      - c2-shared-net
    ports:
      - "8091:8091"
    restart: unless-stopped
    environment:
      - VIRTUAL_VIDEO_PATH=${VIRTUAL_VIDEO_PATH:-}
      - VIRTUAL_CAM_FPS=${VIRTUAL_CAM_FPS:-20}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
    depends_on:
      - mosquitto
    volumes:
      - ./scripts:/app/scripts:ro
      - ./tests/videos:/app/tests/videos:ro
    command: python3 /app/scripts/virtual_cam_server.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  edge_drone:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: isc_edge
    networks:
      - c2-shared-net
    ports:
      - "8090:8090"
    restart: unless-stopped
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - DEFAULT_PROJECT_ID=${DEFAULT_PROJECT_ID:-default-theater}
      - EDGE_SPOOL_DB_PATH=${EDGE_SPOOL_DB_PATH:-/tmp/isc_edge_spool.db}
      - MAVSDK_URL=${MAVSDK_URL:-udp://:14540}
      - CAMERA_SOURCE=${CAMERA_SOURCE:-http://virtual_cam:8091/stream}
      - VIRTUAL_CAM_BASE_URL=${VIRTUAL_CAM_BASE_URL:-http://virtual_cam:8091}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EDGE_LLM_MODEL=${EDGE_LLM_MODEL:-gemini-2.5-flash-lite}
    command: python3 -c "from src.edge.api.server import run_edge_server; run_edge_server(host='0.0.0.0', port=8090)"
    depends_on:
      mosquitto:
        condition: service_started
      minio:
        condition: service_started
      virtual_cam:
        condition: service_healthy

  drone_sim:
    build:
      context: .
      dockerfile: Dockerfile.drone_sim
    container_name: autonomous_drone_env
    network_mode: "service:edge_drone"
    restart: unless-stopped
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - HEADLESS=1
      - DISPLAY=${DISPLAY:-}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}
      - PULSE_SERVER=${PULSE_SERVER:-}
      - QT_X11_NO_MITSHM=1
    depends_on:
      - edge_drone
    command: ["/opt/entrypoint_drone.sh"]

networks:
  c2-shared-net:
    name: c2-shared-net
    driver: bridge

volumes:
  pgdata:
  mosquitto_data:
  minio_data:
  memgraph_data:
